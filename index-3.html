<script>
  /* ============================================================
     طبقة تخزين محلية دائمة على الجهاز (تعمل بلا إنترنت بالكامل)
     ============================================================ */
  (function () {
    const NS = "mariam_life_os_v2__";
    function hasLocalStorage() {
      try {
        const k = "__t__" + NS;
        localStorage.setItem(k, "1");
        localStorage.removeItem(k);
        return true;
      } catch (e) {
        return false;
      }
    }
    const memoryFallback = {};
    const canUseLS = hasLocalStorage();

    window.storage = {
      async get(key /*, shared */) {
        if (canUseLS) {
          const raw = localStorage.getItem(NS + key);
          if (raw === null) throw new Error("key not found");
          return { key, value: raw, shared: false };
        }
        if (!(key in memoryFallback)) throw new Error("key not found");
        return { key, value: memoryFallback[key], shared: false };
      },
      async set(key, value /*, shared */) {
        if (canUseLS) {
          localStorage.setItem(NS + key, value);
        } else {
          memoryFallback[key] = value;
        }
        return { key, value, shared: false };
      },
      async delete(key /*, shared */) {
        if (canUseLS) {
          const existed = localStorage.getItem(NS + key) !== null;
          localStorage.removeItem(NS + key);
          return { key, deleted: existed, shared: false };
        }
        const existed = key in memoryFallback;
        delete memoryFallback[key];
        return { key, deleted: existed, shared: false };
      },
      async list(prefix /*, shared */) {
        const keys = [];
        if (canUseLS) {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(NS)) {
              const clean = k.slice(NS.length);
              if (!prefix || clean.startsWith(prefix)) keys.push(clean);
            }
          }
        } else {
          Object.keys(memoryFallback).forEach((k) => {
            if (!prefix || k.startsWith(prefix)) keys.push(k);
          });
        }
        return { keys, prefix, shared: false };
      },
    };
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

function deepMerge(base, extra) {
  const out = { ...base };
  Object.keys(extra || {}).forEach((k) => {
    if (
      extra[k] && typeof extra[k] === "object" && !Array.isArray(extra[k]) &&
      base[k] && typeof base[k] === "object" && !Array.isArray(base[k])
    ) {
      out[k] = deepMerge(base[k], extra[k]);
    } else if (extra[k] !== undefined) {
      out[k] = extra[k];
    }
  });
  return out;
}

function useDB() {
  const [db, setDB] = useState(null);
  const [status, setStatus] = useState("loading");
  const [lastSaved, setLastSaved] = useState(null);
  const [saving, setSaving] = useState(false);
  const [online, setOnline] = useState(typeof navigator !== "undefined" ? navigator.onLine : true);
  const saveTimer = useRef(null);

  useEffect(() => {
    const on = () => setOnline(true);
    const off = () => setOnline(false);
    window.addEventListener("online", on);
    window.addEventListener("offline", off);
    return () => {
      window.removeEventListener("online", on);
      window.removeEventListener("offline", off);
    };
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setDB(deepMerge(emptyDB(), parsed));
        } else {
          setDB(emptyDB());
        }
        setStatus("ready");
      } catch {
        setDB(emptyDB());
        setStatus("ready");
      }
    })();
  }, []);

  const update = useCallback((updater) => {
    setDB((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (saveTimer.current) clearTimeout(saveTimer.current);
      setSaving(true);
      saveTimer.current = setTimeout(async () => {
        try {
          await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
          setLastSaved(new Date());
        } catch {
          /* تجاهل فشل الحفظ */
        } finally {
          setSaving(false);
        }
      }, 300);
      return next;
    });
  }, []);

  const exportJSON = useCallback(() => {
    if (!db) return;
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `mariam-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }, [db]);

  const importJSON = useCallback(
    (file) => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          update(() => deepMerge(emptyDB(), parsed));
        } catch {
          alert("تعذّرت قراءة الملف — تأكدي أنه نسخة احتياطية صحيحة من التطبيق.");
        }
      };
      reader.readAsText(file);
    },
    [update]
  );

  return { db, update, status, lastSaved, saving, online, exportJSON, importJSON };
}

/* دائرة تقدّم صغيرة (Circular Progress) */
function RingStat({ t, percent, color, size = 58, stroke = 6, icon: Icon, label, value }) {
  const p = clamp(percent || 0, 0, 100);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;

  return (
    <div className="flex flex-col items-center gap-2 shrink-0">
      <div className="relative" style={{ width: size, height: size }}>
        <svg width={size} height={size} className="ring-draw" style={{ "--dash": c, "--off": off }}>
          <defs>
            <linearGradient id={rid} x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity="0.55" />
              <stop offset="100%" stopColor={color} />
            </linearGradient>
          </defs>
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth={stroke} />
          <circle
            cx={size / 2} cy={size / 2} r={r} fill="none" stroke={`url(#${rid})`} strokeWidth={stroke}
            strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}

}

/* رقم متحرك (Count-up) */
function AnimatedNumber({ value, duration = 700, className, style }) {
  const [display, setDisplay] = useState(0);
  const fromRef = useRef(0);
  useEffect(() => {
    const from = fromRef.current;
    const to = Number(value) || 0;
    const start = performance.now();
    let raf;
    const step = (now) => {
      const p = clamp((now - start) / duration, 0, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setDisplay(Math.round(from + (to - from) * eased));
      if (p < 1) raf = requestAnimationFrame(step);
      else fromRef.current = to;
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value, duration]);
  return <span className={className} style={style}>{display}</span>;
}

/* رسم صغير للاتجاه (Sparkline) */
function Sparkline({ values, color, width = 120, height = 34 }) {
  const gid = useRef("spark-" + uid()).current;
  if (!values || values.length < 2) return <div style={{ width, height }} />;
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const step = width / (values.length - 1);
  const pts = values.map((v, i) => [i * step, height - ((v - min) / range) * (height - 6) - 3]);
  const path = pts.map((p, i) => (i === 0 ? `M ${p[0]},${p[1]}` : `L ${p[0]},${p[1]}`)).join(" ");
  const area = `${path} L ${width},${height} L 0,${height} Z`;
  return (
    <svg width={width} height={height} className="spark-in">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="3" fill={color} />
    </svg>
  );
}

/* ---------------- دائرة التوازن (العنصر المميز) ---------------- */
function LifeWheel({ t, domains }) {
  const n = domains.length;
  const size = 272;
  const cx = size / 2;
  const cy = size / 2;
  const rMax = 100;
  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const gid = useRef("wheelgrad-" + uid()).current;
  const gid2 = useRef("wheelglow-" + uid()).current;

  const points = domains.map((d, i) => {
    const r = (clamp(d.percent, 0, 100) / 100) * rMax;
    const a = angle(i);
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
  const outline = domains.map((d, i) => {
    const a = angle(i);
    return [cx + rMax * Math.cos(a), cy + rMax * Math.sin(a)];
  });

  const poly = (pts) => pts.map((p) => p.join(",")).join(" ");
  const avg = Math.round(domains.reduce((s, d) => s + clamp(d.percent, 0, 100), 0) / n);

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="wheel-in">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={t.accent} />
          <stop offset="55%" stopColor={t.accent2} />
          <stop offset="100%" stopColor={t.night} />
        </linearGradient>
        <filter id={gid2} x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
      {[0.33, 0.66, 1].map((f, idx) => (
        <polygon key={idx} points={poly(outline.map(([x, y]) => [cx + (x - cx) * f, cy + (y - cy) * f]))} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="1" />
      ))}
      {outline.map(([x, y], i) => (
        <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(255,255,255,0.08)" strokeWidth="1" />
      ))}
      <polygon points={poly(points)} fill={`url(#${gid})`} fillOpacity="0.3" stroke={`url(#${gid})`} strokeWidth="2.5" filter={`url(#${gid2})`} className="wheel-poly" />
      {points.map(([x, y], i) => (
        <circle key={i} cx={x} cy={y} r="4.5" fill={domains[i].color || t.accent} stroke={t.bg} strokeWidth="1.5" />
      ))}
      <circle cx={cx} cy={cy} r="34" fill="rgba(20,13,24,0.9)" stroke="rgba(255,255,255,0.12)" />
      <text x={cx} y={cy - 3} fill={t.ink} fontSize="20" fontWeight="900" fontFamily="Cairo" textAnchor="middle">{avg}%</text>
      <text x={cx} y={cy + 15} fill={t.inkSoft} fontSize="9" fontFamily="Almarai" textAnchor="middle">توازن الحياة</text>
      {outline.map(([x, y], i) => {
        const a = angle(i);
        const lx = cx + (rMax + 30) * Math.cos(a);
        const ly = cy + (rMax + 30) * Math.sin(a);
        return (
          <text key={i} x={lx} y={ly} fill={t.inkSoft} fontSize="11" fontFamily="Almarai" fontWeight="700" textAnchor="middle" dominantBaseline="middle">
            {domains[i].label}
          </text>
        );
      })}
    </svg>
  );
}

  const weekE = endOfWeek(new Date());

  const tasksWeek = allTasks.filter((x) => x.date && new Date(x.date) >= weekS && new Date(x.date) <= weekE);
  const doneWeek = tasksWeek.filter((x) => x.status === "مكتملة");

/* ============================================================
   قوائم المهام (يومية / شغل)
   ============================================================ */
function TaskListView({ t, db, update, dbKey, title, subtitle, icon, domainLabel, domainPlaceholder, projectLabel }) {
  const [open, setOpen] = useState(false);
  const [draft, setDraft] = useState({ date: todayISO(), priority: "متوسطة" });
  const [filter, setFilter] = useState("الكل");
  const items = db[dbKey];

  const addItem = () => {
    if (!draft.title || !draft.title.trim()) return;
    update((prev) => ({
      ...prev,
      [dbKey]: [{ id: uid(), status: "قيد الانتظار", ...draft }, ...prev[dbKey]],
    }));
    setDraft({ date: todayISO(), priority: "متوسطة" });
    setOpen(false);
  };

  const toggleStatus = (id) => {
    update((prev) => ({
      ...prev,
      [dbKey]: prev[dbKey].map((it) =>
        it.id === id
          ? { ...it, status: it.status === "مكتملة" ? "قيد الانتظار" : it.status === "قيد الانتظار" ? "جارية" : "مكتملة" }
          : it
      ),
    }));
  };

  const removeItem = (id) => {
    update((prev) => ({ ...prev, [dbKey]: prev[dbKey].filter((it) => it.id !== id) }));
  };

  const filtered = useMemo(() => {
    let list = [...items].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    if (filter === "اليوم") list = list.filter((x) => x.date === todayISO());
    else if (filter === "غير منجزة") list = list.filter((x) => x.status !== "مكتملة");
    else if (filter === "مكتملة") list = list.filter((x) => x.status === "مكتملة");
    return list;
  }, [items, filter]);

  const statusStyle = (s) =>
    s === "مكتملة" ? { bg: t.mintSoft, color: t.mint, Icon: CheckCircle2 }
    : s === "جارية" ? { bg: t.skySoft, color: t.sky, Icon: Clock }
    : { bg: t.surfaceAlt, color: t.inkSoft, Icon: Circle };

  const priorityColor = (p) => (p === "عالية" ? t.danger : p === "متوسطة" ? t.amber : t.inkFaint);

  return (
    <div>
      <SectionTitle
        t={t}
        title={title}
        subtitle={subtitle}
        icon={icon}
        right={<PrimaryBtn t={t} onClick={() => setOpen((v) => !v)} icon={open ? X : Plus}>{open ? "إغلاق" : "مهمة جديدة"}</PrimaryBtn>}
      />

      {open && (
        <Card t={t} className="p-4 mb-4 slide-open">
          <div className="grid gap-3 md:grid-cols-2">
            <div className="md:col-span-2">
              <label className="text-xs block mb-1" style={{ color: t.inkSoft }}>عنوان المهمة</label>
              <TextInput t={t} value={draft.title || ""} onChange={(e) => setDraft({ ...draft, title: e.target.value })} placeholder="اكتبي المهمة هنا..." />
            </div>
            <div>
              <label className="text-xs block mb-1" style={{ color: t.inkSoft }}>{domainLabel}</label>
              <TextInput t={t} value={draft.domain || ""} onChange={(e) => setDraft({ ...draft, domain: e.target.value })} placeholder={domainPlaceholder} />
            </div>
            <div>
              <label className="text-xs block mb-1" style={{ color: t.inkSoft }}>{projectLabel}</label>
              <TextInput t={t} value={draft.project || ""} onChange={(e) => setDraft({ ...draft, project: e.target.value })} />
            </div>
            <div>
              <label className="text-xs block mb-1" style={{ color: t.inkSoft }}>التاريخ</label>
              <TextInput t={t} type="date" value={draft.date || ""} onChange={(e) => setDraft({ ...draft, date: e.target.value })} />
            </div>
            <div>
              <label className="text-xs block mb-1" style={{ color: t.inkSoft }}>الأولوية</label>
              <Select t={t} value={draft.priority || "متوسطة"} onChange={(e) => setDraft({ ...draft, priority: e.target.value })}>
                <option value="عالية">عالية</option>
                <option value="متوسطة">متوسطة</option>
                <option value="منخفضة">منخفضة</option>
              </Select>
            </div>
          </div>
          <div className="flex justify-end mt-3">
            <PrimaryBtn t={t} onClick={addItem} icon={Check}>حفظ المهمة</PrimaryBtn>
          </div>
        </Card>
      )}

      <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
        {["الكل", "اليوم", "غير منجزة", "مكتملة"].map((f) => (
          <button
            key={f}
            onClick={() => setFilter(f)}
            className="px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors"
            style={{ background: filter === f ? t.accent : t.surfaceAlt, color: filter === f ? "#fff" : t.inkSoft, fontFamily: "Cairo" }}
          >
            {f}
          </button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <Card t={t} className="p-6"><EmptyState t={t} icon={ClipboardList} text="لا توجد مهام مطابقة — أضيفي مهمة جديدة لتبدأ يومك." /></Card>
      ) : (
        <div className="space-y-2">
          {filtered.map((it, idx) => {
            const st = statusStyle(it.status);
            return (
              <Card key={it.id} t={t} className="p-3 list-item-in" style={{ animationDelay: `${Math.min(idx, 10) * 35}ms` }}>
                <div className="flex items-center gap-3">
                  <button onClick={() => toggleStatus(it.id)} className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 transition-transform active:scale-90" style={{ background: st.bg, color: st.color }}>
                    <st.Icon size={17} />
                  </button>
                  <div className="min-w-0 flex-1">
                    <p className="font-bold text-sm truncate" style={{ color: it.status === "مكتملة" ? t.inkFaint : t.ink, textDecoration: it.status === "مكتملة" ? "line-through" : "none", fontFamily: "Cairo" }}>
                      {it.title}
                    </p>
                    <div className="flex flex-wrap gap-x-3 gap-y-0.5 mt-1">
                      {it.domain && <span className="text-xs" style={{ color: t.inkSoft }}>{domainLabel}: {it.domain}</span>}
                      {it.project && <span className="text-xs" style={{ color: t.inkSoft }}>{projectLabel}: {it.project}</span>}
                      {it.date && <span className="text-xs" style={{ color: t.inkSoft }}>{fmtDate(it.date)}</span>}
                    </div>
                  </div>
                  <span className="text-xs px-2 py-1 rounded-full shrink-0" style={{ background: priorityColor(it.priority) + "22", color: priorityColor(it.priority) }}>{it.priority}</span>
                  <IconBtn t={t} danger onClick={() => removeItem(it.id)} title="حذف"><Trash2 size={15} /></IconBtn>
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ContentPlanView({ t, db, update }) {

    update((p) => ({
      ...p,
      learningLog: [{ id: uid(), ...logDraft, hours: Number(logDraft.hours) }, ...p.learningLog],

  const totalHours = db.learningCategories.reduce((s, c) => s + c.hours, 0);

  return (
    <div>

            <div key={c.id}>
              <div className="flex justify-between mb-1">
                <span className="text-sm font-bold" style={{ color: t.ink }}>{c.name}</span>
                <div className="flex items-center gap-2">
                  <span className="text-xs" style={{ color: t.inkSoft }}>{c.hours} ساعة</span>

          <TextInput t={t} type="date" value={logDraft.date} onChange={(e) => setLogDraft({ ...logDraft, date: e.target.value })} />
        </div>
        <div className="flex justify-end mt-3">
          <PrimaryBtn t={t} onClick={addLog} icon={Check}>حفظ الجلسة</PrimaryBtn>
        </div>
        {db.learningLog.length > 0 && (

}

  const today = todayISO();
  const deen = db.deen;
  const prayers = ["الفجر", "الظهر", "العصر", "المغرب", "العشاء"];
  const todayPrayers = deen.prayers[today] || {};

  const togglePrayer = (p) => {
    update((prev) => ({
      ...prev,
      deen: { ...prev.deen, prayers: { ...prev.deen.prayers, [today]: { ...(prev.deen.prayers[today] || {}), [p]: !(prev.deen.prayers[today] || {})[p] } } },
    }));
  };

  const toggleWird = () => update((prev) => ({ ...prev, deen: { ...prev.deen, wird: { ...prev.deen.wird, [today]: !prev.deen.wird[today] } } }));
  const toggleAzkar = (kind) => update((prev) => ({ ...prev, deen: { ...prev.deen, azkar: { ...prev.deen.azkar, [today]: { ...(prev.deen.azkar[today] || {}), [kind]: !(prev.deen.azkar[today] || {})[kind] } } } }));
  const toggleFasting = () => update((prev) => ({ ...prev, deen: { ...prev.deen, fasting: { ...prev.deen.fasting, [today]: !prev.deen.fasting[today] } } }));

  const todayAzkar = deen.azkar[today] || {};

  const setHifz = (k, v) => update((prev) => ({ ...prev, deen: { ...prev.deen, hifz: { ...prev.deen.hifz, [k]: v } } }));
  const logHifz = () => {
    if (!deen.hifz.surah) return;
    update((prev) => ({
      ...prev,
      deen: { ...prev.deen, hifzLog: [{ id: uid(), date: today, surah: prev.deen.hifz.surah, ayah: prev.deen.hifz.ayah }, ...prev.deen.hifzLog] },
    }));
  };

  const addSadaqah = (text) => update((prev) => ({ ...prev, deen: { ...prev.deen, sadaqah: [{ id: uid(), date: today, text }, ...prev.deen.sadaqah] } }));
  const delSadaqah = (id) => update((prev) => ({ ...prev, deen: { ...prev.deen, sadaqah: prev.deen.sadaqah.filter((x) => x.id !== id) } }));

  const prayerCountToday = prayers.filter((p) => todayPrayers[p]).length;

  return (
    <div>
      <SectionTitle t={t} title="القرآن والعبادات" subtitle="رفقًا بنفسك — استمراريتك أهم من كمالها" icon={BookOpen} />

      <Card t={t} className="p-5 mb-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold" style={{ color: t.ink, fontFamily: "Cairo" }}>صلوات اليوم</h3>
          <span className="text-xs px-2 py-1 rounded-full" style={{ background: t.goldSoft, color: t.gold }}>{prayerCountToday}/5</span>
        </div>
        <div className="grid grid-cols-5 gap-2">
          {prayers.map((p) => (
            <button
              key={p}
              onClick={() => togglePrayer(p)}
              className="flex flex-col items-center gap-1.5 py-3 rounded-xl border transition-all active:scale-95"
              style={{ borderColor: todayPrayers[p] ? t.gold : t.border, background: todayPrayers[p] ? t.goldSoft : "transparent" }}
            >
              <Sunrise size={16} color={todayPrayers[p] ? t.gold : t.inkFaint} />
              <span className="text-xs font-bold" style={{ color: todayPrayers[p] ? t.gold : t.inkSoft }}>{p}</span>
            </button>
          ))}
        </div>
      </Card>

      <div className="grid md:grid-cols-2 gap-4 mb-4">
        <Card t={t} className="p-5">
          <h3 className="font-bold mb-3" style={{ color: t.ink, fontFamily: "Cairo" }}>الورد والأذكار والصيام</h3>
          <div className="space-y-2">
            <button onClick={toggleWird} className="w-full flex items-center justify-between p-3 rounded-xl border" style={{ borderColor: deen.wird[today] ? t.mint : t.border, background: deen.wird[today] ? t.mintSoft : "transparent" }}>
              <span className="text-sm font-bold" style={{ color: deen.wird[today] ? t.mint : t.ink }}>الورد القرآني اليومي</span>
              {deen.wird[today] ? <CheckCircle2 size={18} color={t.mint} /> : <Circle size={18} color={t.inkFaint} />}
            </button>
            <button onClick={() => toggleAzkar("morning")} className="w-full flex items-center justify-between p-3 rounded-xl border" style={{ borderColor: todayAzkar.morning ? t.sky : t.border, background: todayAzkar.morning ? t.skySoft : "transparent" }}>
              <span className="text-sm font-bold" style={{ color: todayAzkar.morning ? t.sky : t.ink }}>أذكار الصباح</span>
              {todayAzkar.morning ? <CheckCircle2 size={18} color={t.sky} /> : <Circle size={18} color={t.inkFaint} />}
            </button>
            <button onClick={() => toggleAzkar("evening")} className="w-full flex items-center justify-between p-3 rounded-xl border" style={{ borderColor: todayAzkar.evening ? t.night : t.border, background: todayAzkar.evening ? t.nightSoft : "transparent" }}>
              <span className="text-sm font-bold" style={{ color: todayAzkar.evening ? t.night : t.ink }}>أذكار المساء</span>
              {todayAzkar.evening ? <CheckCircle2 size={18} color={t.night} /> : <Circle size={18} color={t.inkFaint} />}
            </button>
            <button onClick={toggleFasting} className="w-full flex items-center justify-between p-3 rounded-xl border" style={{ borderColor: deen.fasting[today] ? t.amber : t.border, background: deen.fasting[today] ? t.amberSoft : "transparent" }}>
              <span className="text-sm font-bold" style={{ color: deen.fasting[today] ? t.amber : t.ink }}>صيام اليوم</span>
              {deen.fasting[today] ? <CheckCircle2 size={18} color={t.amber} /> : <Circle size={18} color={t.inkFaint} />}
            </button>
          </div>
        </Card>

        <Card t={t} className="p-5">
          <h3 className="font-bold mb-3" style={{ color: t.ink, fontFamily: "Cairo" }}>الحفظ</h3>
          <div className="grid grid-cols-2 gap-2 mb-2">
            <TextInput t={t} value={deen.hifz.surah} onChange={(e) => setHifz("surah", e.target.value)} placeholder="السورة الحالية" />
            <TextInput t={t} value={deen.hifz.ayah} onChange={(e) => setHifz("ayah", e.target.value)} placeholder="رقم الآية" />
          </div>
          <label className="text-xs block mb-1" style={{ color: t.inkSoft }}>نسبة الحفظ الكلية: {deen.hifz.percent}%</label>
          <input type="range" min="0" max="100" value={deen.hifz.percent} onChange={(e) => setHifz("percent", Number(e.target.value))} className="w-full mb-2" />
          <PrimaryBtn t={t} onClick={logHifz} icon={Check}>تسجيل جلسة حفظ اليوم</PrimaryBtn>
          {deen.hifzLog.length > 0 && (
            <div className="mt-3 space-y-1 max-h-28 overflow-y-auto">
              {deen.hifzLog.slice(0, 6).map((h) => (
                <div key={h.id} className="text-xs flex justify-between p-1.5 rounded-lg" style={{ background: t.surfaceAlt, color: t.inkSoft }}>
                  <span>{h.surah} {h.ayah && `— آية ${h.ayah}`}</span>
                  <span>{fmtDateShort(h.date)}</span>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>

      <Card t={t} className="p-5">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold" style={{ color: t.ink, fontFamily: "Cairo" }}>الصدقة والأعمال الصالحة</h3>
          <AddInline t={t} onAdd={addSadaqah} placeholder="عمل خير جديد..." />
        </div>
        {deen.sadaqah.length === 0 ? (
          <EmptyState t={t} icon={Gift} text="سجّلي كل عمل خير — قليله كثير." />
        ) : (
          <div className="space-y-1.5 max-h-40 overflow-y-auto">
            {deen.sadaqah.map((s) => (
              <div key={s.id} className="flex items-center justify-between text-xs p-2 rounded-lg" style={{ background: t.surfaceAlt }}>
                <span style={{ color: t.ink }}>{s.text}</span>
                <div className="flex items-center gap-2">
                  <span style={{ color: t.inkSoft }}>{fmtDateShort(s.date)}</span>
                  <IconBtn t={t} danger onClick={() => delSadaqah(s.id)}><Trash2 size={12} /></IconBtn>
                </div>
              </div>
            ))}
          </div>
        )}
        <TextArea t={t} rows={2} value={deen.monthlyNotes} onChange={(e) => update((prev) => ({ ...prev, deen: { ...prev.deen, monthlyNotes: e.target.value } }))} placeholder="ملاحظات إيمانية للشهر..." className="mt-3" />
      </Card>
    </div>
  );
}

/* ============================================================
   الصحة
   ============================================================ */
function HealthView({ t, db, update }) {
  const today = todayISO();
  const health = db.health;
  const water = Number(health.water[today]) || 0;
  const sleep = health.sleep[today] || "";
  const exercised = !!health.exercise[today];
  const mood = health.mood[today] || "";

  const setWater = (v) => update((prev) => ({ ...prev, health: { ...prev.health, water: { ...prev.health.water, [today]: clamp(v, 0, 16) } } }));
  const setSleep = (v) => update((prev) => ({ ...prev, health: { ...prev.health, sleep: { ...prev.health.sleep, [today]: v } } }));
  const toggleExercise = () => update((prev) => ({ ...prev, health: { ...prev.health, exercise: { ...prev.health.exercise, [today]: !prev.health.exercise[today] } } }));
  const setMood = (m) => update((prev) => ({ ...prev, health: { ...prev.health, mood: { ...prev.health.mood, [today]: m } } }));

  const addWeight = (weightStr) => {
    const w = Number(weightStr);
    if (!w) return;
    update((prev) => ({ ...prev, health: { ...prev.health, weightLog: [{ id: uid(), date: today, weight: w }, ...prev.health.weightLog] } }));
  };
  const delWeight = (id) => update((prev) => ({ ...prev, health: { ...prev.health, weightLog: prev.health.weightLog.filter((x) => x.id !== id) } }));

  const moods = [
    { key: "رائعة", icon: "😄" },
    { key: "بخير", icon: "🙂" },
    { key: "متعبة", icon: "😔" },
    { key: "متوترة", icon: "😣" },
  ];

  return (
    <div>
      <SectionTitle t={t} title="الصحة" subtitle="جسدك أمانة — اهتمي به كل يوم بخطوة بسيطة" icon={HeartPulse} />

      <div className="grid md:grid-cols-3 gap-4 mb-4">
        <Card t={t} className="p-5">
          <div className="flex items-center gap-2 mb-3">
            <Droplet size={18} color={t.sky} />
            <h3 className="font-bold" style={{ color: t.ink, fontFamily: "Cairo" }}>الماء</h3>
          </div>
          <p className="text-2xl font-extrabold mb-2" style={{ color: t.ink, fontFamily: "Cairo" }}>{water} <span className="text-sm" style={{ color: t.inkSoft }}>/ 8 أكواب</span></p>
          <ProgressBar t={t} percent={water * 12.5} color={t.sky} />
          <div className="flex gap-2 mt-3">
            <GhostBtn t={t} onClick={() => setWater(water - 1)}>-</GhostBtn>
            <GhostBtn t={t} onClick={() => setWater(water + 1)}>+ كوب</GhostBtn>
          </div>
        </Card>

        <Card t={t} className="p-5">
          <div className="flex items-center gap-2 mb-3">
            <MoonIcon size={18} color={t.night} />
            <h3 className="font-bold" style={{ color: t.ink, fontFamily: "Cairo" }}>النوم</h3>
          </div>
          <TextInput t={t} type="number" step="0.5" min="0" max="14" value={sleep} onChange={(e) => setSleep(e.target.value)} placeholder="عدد ساعات النوم" />
          <p className="text-xs mt-2" style={{ color: t.inkSoft }}>هدفك: 7 إلى 8 ساعات يوميًا</p>
        </Card>

        <Card t={t} className="p-5">
          <div className="flex items-center gap-2 mb-3">
            <Dumbbell size={18} color={t.amber} />
            <h3 className="font-bold" style={{ color: t.ink, fontFamily: "Cairo" }}>الحركة</h3>
          </div>
          <button onClick={toggleExercise} className="w-full flex items-center justify-between p-3 rounded-xl border" style={{ borderColor: exercised ? t.amber : t.border, background: exercised ? t.amberSoft : "transparent" }}>
            <span className="text-sm font-bold" style={{ color: exercised ? t.amber : t.ink }}>تمرّنتُ اليوم</span>
            {exercised ? <CheckCircle2 size={18} color={t.amber} /> : <Circle size={18} color={t.inkFaint} />}
          </button>
        </Card>
      </div>

      <Card t={t} className="p-5 mb-4">
        <h3 className="font-bold mb-3" style={{ color: t.ink, fontFamily: "Cairo" }}>مزاجك اليوم</h3>
        <div className="grid grid-cols-4 gap-2">
          {moods.map((m) => (
            <button
              key={m.key}
              onClick={() => setMood(m.key)}
              className="flex flex-col items-center gap-1 py-3 rounded-xl border transition-all active:scale-95"
              style={{ borderColor: mood === m.key ? t.accent : t.border, background: mood === m.key ? t.accentSoft : "transparent" }}
            >
              <span className="text-xl">{m.icon}</span>
              <span className="text-xs font-bold" style={{ color: mood === m.key ? t.accent : t.inkSoft }}>{m.key}</span>
            </button>
          ))}
        </div>
      </Card>

      <Card t={t} className="p-5">
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">
            <Scale size={18} color={t.mint} />
            <h3 className="font-bold" style={{ color: t.ink, fontFamily: "Cairo" }}>الوزن</h3>
          </div>
          <AddInline t={t} onAdd={addWeight} placeholder="الوزن بالكيلو..." />
        </div>
        {health.weightLog.length === 0 ? (
          <EmptyState t={t} icon={Scale} text="سجّلي وزنك بانتظام لمتابعة تقدّمك." />
        ) : (
          <div className="space-y-1.5 max-h-40 overflow-y-auto">
            {health.weightLog.slice(0, 8).map((w) => (
              <div key={w.id} className="flex items-center justify-between text-xs p-2 rounded-lg" style={{ background: t.surfaceAlt }}>
                <span style={{ color: t.ink }} className="font-bold">{w.weight} كجم</span>
                <div className="flex items-center gap-2">
                  <span style={{ color: t.inkSoft }}>{fmtDateShort(w.date)}</span>
                  <IconBtn t={t} danger onClick={() => delWeight(w.id)}><Trash2 size={12} /></IconBtn>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

/* ============================================================
   رشاد والتربية
   ============================================================ */
function RashadView({ t, db, update }) {
  const r = db.rashad;
  const addNeed = (text) => update((p) => ({ ...p, rashad: { ...p.rashad, needs: [{ id: uid(), text, done: false }, ...p.rashad.needs] } }));
  const toggleNeed = (id) => update((p) => ({ ...p, rashad: { ...p.rashad, needs: p.rashad.needs.map((x) => x.id === id ? { ...x, done: !x.done } : x) } }));
  const delNeed = (id) => update((p) => ({ ...p, rashad: { ...p.rashad, needs: p.rashad.needs.filter((x) => x.id !== id) } }));

  const addGoal = (text) => update((p) => ({ ...p, rashad: { ...p.rashad, parentingGoals: [{ id: uid(), text }, ...p.rashad.parentingGoals] } }));
  const delGoal = (id) => update((p) => ({ ...p, rashad: { ...p.rashad, parentingGoals: p.rashad.parentingGoals.filter((x) => x.id !== id) } }));

  const addLesson = (item) => update((p) => ({ ...p, rashad: { ...p.rashad, dailyLessons: [{ id: uid(), date: todayISO(), ...item }, ...p.rashad.dailyLessons] } }));
  const delLesson = (id) => update((p) => ({ ...p, rashad: { ...p.rashad, dailyLessons: p.rashad.dailyLessons.filter((x) => x.id !== id) } }));

  const addMilestone = (item) => update((p) => ({ ...p, rashad: { ...p.rashad, milestones: [{ id: uid(), ...item }, ...p.rashad.milestones] } }));
  const delMilestone = (id) => update((p) => ({ ...p, rashad: { ...p.rashad, milestones: p.rashad.milestones.filter((x) => x.id !== id) } }));

  return (
    <div>
      <SectionTitle t={t} title="رشاد والتربية" subtitle="كل لحظة معه استثمار — وثّقيها ولا تنسي نفسك" icon={Baby} />

      <div className="grid md:grid-cols-2 gap-4 mb-4">
        <Card t={t} className="p-5">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-bold" style={{ color: t.ink, fontFamily: "Cairo" }}>احتياجات رشاد</h3>
            <AddInline t={t} onAdd={addNeed} placeholder="احتياج جديد..." />
          </div>
          {r.needs.length === 0 ? (
            <EmptyState t={t} icon={Baby} text="أضيفي احتياجات رشاد لمتابعتها." />
          ) : (
            <div className="space-y-2">
              {r.needs.map((n) => (
                <div key={n.id} className="flex items-center gap-3 p-2.5 rounded-xl border" style={{ borderColor: t.border }}>
                  <button onClick={() => toggleNeed(n.id)} className="w-6 h-6 rounded-md flex items-center justify-center shrink-0" style={{ background: n.done ? t.mintSoft : t.surfaceAlt, color: n.done ? t.mint : t.inkFaint }}>
                    {n.done && <Check size={14} />}
                  </button>
                  <span className="flex-1 text-sm" style={{ color: n.done ? t.inkFaint : t.ink, textDecoration: n.done ? "line-through" : "none" }}>{n.text}</span>
                  <IconBtn t={t} danger onClick={() => delNeed(n.id)}><Trash2 size={14} /></IconBtn>
                </div>
              ))}
            </div>
          )}
        </Card>

        <Card t={t} className="p-5">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-bold" style={{ color: t.ink, fontFamily: "Cairo" }}>أهداف تربوية</h3>
            <AddInline t={t} onAdd={addGoal} placeholder="هدف تربوي..." />
          </div>
          {r.parentingGoals.length === 0 ? (
            <EmptyState t={t} icon={Target} text="حدّدي أهدافك التربوية لرشاد." />
          ) : (
            <div className="space-y-1.5">
              {r.parentingGoals.map((g) => (
                <div key={g.id} className="flex items-center justify-between text-sm p-2.5 rounded-lg" style={{ background: t.surfaceAlt, color: t.ink }}>
                  <span>{g.text}</span>
                  <IconBtn t={t} danger onClick={() => delGoal(g.id)}><Trash2 size={13} /></IconBtn>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>

      <Card t={t} className="p-5 mb-4">
        <h3 className="font-bold mb-3" style={{ color: t.ink, fontFamily: "Cairo" }}>معالم النمو</h3>
        <RecordList
          t={t}
          items={r.milestones}
          onAdd={addMilestone}
          onDelete={delMilestone}
          searchable={false}
          emptyHint="سجّلي أول كلمة، أول خطوة، وكل معلم يفرحك."
          fields={[
            { key: "title", label: "المعلم" },
            { key: "date", label: "التاريخ", type: "date" },
            { key: "note", label: "ملاحظة", placeholder: "تفاصيل جميلة عن اللحظة..." },
          ]}
        />
      </Card>

      <Card t={t} className="p-5">
        <h3 className="font-bold mb-3" style={{ color: t.ink, fontFamily: "Cairo" }}>دروس ولحظات يومية</h3>
        <RecordList
          t={t}
          items={r.dailyLessons}
          onAdd={(item) => addLesson({ ...item, date: item.date || todayISO() })}
          onDelete={delLesson}
          searchable={false}
          emptyHint="وثّقي أجمل ما تعلّمه رشاد أو ما تعلّمتِه منه اليوم."
          fields={[
            { key: "title", label: "ماذا حدث؟" },
            { key: "date", label: "التاريخ", type: "date" },
          ]}
        />
        <TextArea t={t} rows={3} value={r.notes} onChange={(e) => update((p) => ({ ...p, rashad: { ...p.rashad, notes: e.target.value } }))} placeholder="ملاحظات عامة عن رشاد..." className="mt-3" />
      </Card>
    </div>
  );
}

/* ============================================================
   الترفيه ووقت الفراغ
   ============================================================ */
function LeisureView({ t, db, update }) {
  const l = db.leisure;
  const today = todayISO();
  const weekS = startOfWeek(new Date());
  const weekE = endOfWeek(new Date());

  const addHobby = (name) => update((p) => ({ ...p, leisure: { ...p.leisure, hobbies: [...p.leisure.hobbies, { id: uid(), name, weeklyGoal: 1 }] } }));
  const delHobby = (id) => update((p) => ({ ...p, leisure: { ...p.leisure, hobbies: p.leisure.hobbies.filter((x) => x.id !== id) } }));
  const setGoal = (id, v) => update((p) => ({ ...p, leisure: { ...p.leisure, hobbies: p.leisure.hobbies.map((h) => h.id === id ? { ...h, weeklyGoal: clamp(Number(v) || 0, 0, 14) } : h) } }));

  const [logDraft, setLogDraft] = useState({ hobby: "", date: today, note: "" });
  const addActivity = () => {
    if (!logDraft.hobby) return;
    update((p) => ({ ...p, leisure: { ...p.leisure, activityLog: [{ id: uid(), ...logDraft }, ...p.leisure.activityLog] } }));
    setLogDraft({ hobby: "", date: today, note: "" });
  };
  const delActivity = (id) => update((p) => ({ ...p, leisure: { ...p.leisure, activityLog: p.leisure.activityLog.filter((x) => x.id !== id) } }));

  const countThisWeek = (name) => l.activityLog.filter((a) => a.hobby === name && a.date && new Date(a.date) >= weekS && new Date(a.date) <= weekE).length;

  const addWatch = (item) => update((p) => ({ ...p, leisure: { ...p.leisure, watchlist: [{ ...item, watched: false }, ...p.leisure.watchlist] } }));
  const delWatch = (id) => update((p) => ({ ...p, leisure: { ...p.leisure, watchlist: p.leisure.watchlist.filter((x) => x.id !== id) } }));
  const toggleWatch = (id) => update((p) => ({ ...p, leisure: { ...p.leisure, watchlist: p.leisure.watchlist.map((x) => x.id === id ? { ...x, watched: !x.watched } : x) } }));

  return (
    <div>
      <SectionTitle t={t} title="هوايات وترفيه" subtitle="الراحة جزء من الإنتاجية، مش رفاهية — امنحي نفسك وقتك" icon={Gamepad2} />

      <Card t={t} className="p-5 mb-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold" style={{ color: t.ink, fontFamily: "Cairo" }}>هواياتي وأهدافها الأسبوعية</h3>
          <AddInline t={t} onAdd={addHobby} placeholder="هواية جديدة..." />
        </div>
        {l.hobbies.length === 0 ? (
          <EmptyState t={t} icon={Palette} text="أضيفي هواية تحبينها لمتابعتها هنا." />
        ) : (

function JournalView({ t, db, update }) {

  const addEntry = () => {
    if (!draft.note.trim() && !draft.gratitude.trim()) return;
    update((p) => ({ ...p, journal: { entries: [{ id: uid(), ...draft }, ...p.journal.entries] } }));
    setDraft({ date: todayISO(), mood: "", gratitude: "", note: "" });
  };
  const delEntry = (id) => update((p) => ({ ...p, journal: { entries: p.journal.entries.filter((x) => x.id !== id) } }));

  return (
    <div>
      <SectionTitle t={t} title="يوميات وتأملات" subtitle="مساحتك الخاصة — اكتبي بلا رقابة ولا حكم" icon={PenLine} />

      <Card t={t} className="p-5 mb-4">
        <div className="flex items-center gap-2 mb-3">
          {moods.map((m) => (
            <button key={m} onClick={() => setDraft({ ...draft, mood: m })} className="text-2xl w-11 h-11 rounded-xl flex items-center justify-center transition-transform active:scale-90" style={{ background: draft.mood === m ? t.accentSoft : t.surfaceAlt, outline: draft.mood === m ? `2px solid ${t.accent}` : "none" }}>
              {m}
            </button>
          ))}
        </div>
        <label className="text-xs block mb-1" style={{ color: t.inkSoft }}>أنا ممتنة اليوم لـ...</label>
        <TextInput t={t} value={draft.gratitude} onChange={(e) => setDraft({ ...draft, gratitude: e.target.value })} placeholder="اكتبي شيئًا تشكرين عليه اليوم" className="mb-3" />
        <label className="text-xs block mb-1" style={{ color: t.inkSoft }}>خواطر اليوم</label>
        <TextArea t={t} rows={3} value={draft.note} onChange={(e) => setDraft({ ...draft, note: e.target.value })} placeholder="اكتبي ما يدور في ذهنك..." />

      ) : (
        <div className="space-y-2">
          {db.journal.entries.map((e, idx) => (

                <div className="flex items-start gap-3 min-w-0">
                  {e.mood && <span className="text-xl shrink-0">{e.mood}</span>}
                  <div className="min-w-0">
                    {e.gratitude && <p className="text-sm font-bold mb-1" style={{ color: t.gold }}>ممتنة لـ: {e.gratitude}</p>}
                    {e.note && <p className="text-sm leading-relaxed" style={{ color: t.ink }}>{e.note}</p>}
                    <p className="text-xs mt-1" style={{ color: t.inkSoft }}>{fmtDate(e.date)}</p>
                  </div>
                </div>
                <IconBtn t={t} danger onClick={() => delEntry(e.id)}><Trash2 size={14} /></IconBtn>

/* ============================================================
   العادات
   ============================================================ */
const HABIT_ICONS = { book: BookOpen, drop: Droplet, baby: Baby, quran: Star, heart: Heart, default: Repeat };

function HabitsView({ t, db, update }) {
  const days = Array.from({ length: 7 }, (_, i) => isoDaysAgo(6 - i));
  const dayLabels = days.map((d) => new Date(d + "T00:00:00").toLocaleDateString("ar-EG", { weekday: "short" }));

  const addHabit = (name) => update((p) => ({ ...p, habits: [...p.habits, { id: uid(), name, icon: "default", done: {} }] }));
  const delHabit = (id) => update((p) => ({ ...p, habits: p.habits.filter((h) => h.id !== id) }));
  const toggleDone = (id, day) => update((p) => ({
    ...p,
    habits: p.habits.map((h) => h.id === id ? { ...h, done: { ...h.done, [day]: !h.done[day] } } : h),
  }));

  const streak = (h) => {
    let s = 0;
    for (let i = 0; i < 60; i++) {
      const d = isoDaysAgo(i);
      if (h.done[d]) s++;
      else break;
    }
    return s;
  };

  return (
    <div>
      <SectionTitle t={t} title="العادات" subtitle="التكرار الصغير اليومي هو سرّ التغيير الكبير" icon={Repeat} right={<AddInline t={t} onAdd={addHabit} placeholder="عادة جديدة..." />} />

      {db.habits.length === 0 ? (
        <Card t={t} className="p-6"><EmptyState t={t} icon={Flame} text="أضيفي أول عادة تريدين متابعتها." /></Card>
      ) : (
        <Card t={t} className="p-4 overflow-x-auto">
          <table className="w-full text-sm" style={{ minWidth: 480 }}>
            <thead>
              <tr>
                <th className="text-right py-2 px-2 font-bold" style={{ color: t.inkSoft, fontFamily: "Cairo" }}>العادة</th>
                {dayLabels.map((d, i) => (
                  <th key={i} className="text-center py-2 px-1 font-bold text-xs" style={{ color: t.inkSoft }}>{d}</th>
                ))}
                <th className="text-center py-2 px-2 font-bold text-xs" style={{ color: t.inkSoft }}>سلسلة</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {db.habits.map((h) => {
                const Icon = HABIT_ICONS[h.icon] || HABIT_ICONS.default;
                return (
                  <tr key={h.id} className="border-t" style={{ borderColor: t.border }}>
                    <td className="py-2 px-2">
                      <div className="flex items-center gap-2">
                        <div className="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style={{ background: t.accentSoft, color: t.accent }}>
                          <Icon size={14} />
                        </div>
                        <span className="font-bold whitespace-nowrap" style={{ color: t.ink }}>{h.name}</span>
                      </div>
                    </td>
                    {days.map((d) => (
                      <td key={d} className="text-center py-2 px-1">
                        <button
                          onClick={() => toggleDone(h.id, d)}
                          className="w-7 h-7 rounded-lg inline-flex items-center justify-center transition-transform active:scale-90"
                          style={{ background: h.done[d] ? t.mint : t.surfaceAlt, color: h.done[d] ? "#0F1F1A" : "transparent" }}
                        >
                          {h.done[d] && <Check size={14} />}
                        </button>
                      </td>
                    ))}
                    <td className="text-center py-2 px-2">
                      <span className="inline-flex items-center gap-1 text-xs font-bold" style={{ color: t.amber }}>
                        <Flame size={13} /> {streak(h)}
                      </span>
                    </td>
                    <td className="text-center py-2 px-1">
                      <IconBtn t={t} danger onClick={() => delHabit(h.id)}><Trash2 size={13} /></IconBtn>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      )}
    </div>
  );
}

/* ============================================================
   مصاريف ودخل البيت
   ============================================================ */
function HomeView({ t, db, update }) {
  const addExpense = (item) => update((p) => ({ ...p, home: { ...p.home, expenses: [{ id: uid(), date: todayISO(), ...item }, ...p.home.expenses] } }));
  const delExpense = (id) => update((p) => ({ ...p, home: { ...p.home, expenses: p.home.expenses.filter((x) => x.id !== id) } }));
  const addIncome = (item) => update((p) => ({ ...p, home: { ...p.home, income: [{ id: uid(), date: todayISO(), ...item }, ...(p.home.income || [])] } }));
  const delIncome = (id) => update((p) => ({ ...p, home: { ...p.home, income: (p.home.income || []).filter((x) => x.id !== id) } }));

  const monthStr = todayISO().slice(0, 7);
  const monthExp = db.home.expenses.filter((e) => e.date && e.date.startsWith(monthStr)).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const monthInc = (db.home.income || []).filter((e) => e.date && e.date.startsWith(monthStr)).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const net = monthInc - monthExp;

  const byCat = {};
  db.home.expenses.filter((e) => e.date && e.date.startsWith(monthStr)).forEach((e) => {
    byCat[e.category || "أخرى"] = (byCat[e.category || "أخرى"] || 0) + (Number(e.amount) || 0);
  });

  return (
    <div>
      <SectionTitle t={t} title="مصاريف ودخل البيت" subtitle="وضوح ماليك يمنحك راحة بال" icon={Wallet} />

      <div className="grid grid-cols-3 gap-3 mb-4">
        <Card t={t} className="p-4 text-center">
          <p className="text-xs mb-1" style={{ color: t.inkSoft }}>دخل الشهر</p>
          <p className="text-lg font-extrabold" style={{ color: t.mint, fontFamily: "Cairo" }}>{fmtMoney(monthInc)}</p>
        </Card>
        <Card t={t} className="p-4 text-center">
          <p className="text-xs mb-1" style={{ color: t.inkSoft }}>مصاريف الشهر</p>
          <p className="text-lg font-extrabold" style={{ color: t.danger, fontFamily: "Cairo" }}>{fmtMoney(monthExp)}</p>
        </Card>
        <Card t={t} className="p-4 text-center">
          <p className="text-xs mb-1" style={{ color: t.inkSoft }}>الصافي</p>
          <p className="text-lg font-extrabold" style={{ color: net >= 0 ? t.mint : t.danger, fontFamily: "Cairo" }}>{fmtMoney(net)}</p>
        </Card>
      </div>

      {Object.keys(byCat).length > 0 && (
        <Card t={t} className="p-5 mb-4">
          <h3 className="font-bold mb-3" style={{ color: t.ink, fontFamily: "Cairo" }}>المصاريف حسب التصنيف</h3>
          <div className="space-y-2">
            {Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([cat, amt]) => (
              <div key={cat}>
                <div className="flex justify-between mb-1">
                  <span className="text-sm" style={{ color: t.ink }}>{cat}</span>
                  <span className="text-xs" style={{ color: t.inkSoft }}>{fmtMoney(amt)}</span>
                </div>
                <ProgressBar t={t} percent={monthExp ? (amt / monthExp) * 100 : 0} color={t.amber} height={6} />
              </div>
            ))}
          </div>
        </Card>
      )}

      <div className="grid md:grid-cols-2 gap-4">
        <RecordList
          t={t}
          title="المصاريف"
          icon={Wallet}
          items={db.home.expenses}
          onAdd={addExpense}
          onDelete={delExpense}
          emptyHint="أضيفي أول مصروف."
          fields={[
            { key: "title", label: "البند" },
            { key: "amount", label: "المبلغ", type: "number" },
            { key: "category", label: "التصنيف", placeholder: "طعام، فواتير، رشاد، شخصي..." },
            { key: "date", label: "التاريخ", type: "date" },
          ]}
        />
        <RecordList
          t={t}
          title="الدخل"
          icon={TrendingUp}
          items={db.home.income || []}
          onAdd={addIncome}
          onDelete={delIncome}
          emptyHint="أضيفي مصادر الدخل."
          fields={[
            { key: "title", label: "المصدر" },
            { key: "amount", label: "المبلغ", type: "number" },
            { key: "date", label: "التاريخ", type: "date" },
          ]}
        />
      </div>
    </div>
  );
}

/* ============================================================
   الخطط والأهداف
   ============================================================ */
function PlansView({ t, db, update }) {
  const [tab, setTab] = useState("daily");
  const tabs = [
    { id: "daily", label: "يومية" },
    { id: "weekly", label: "أسبوعية" },
    { id: "monthly", label: "شهرية" },
    { id: "yearly", label: "سنوية" },
  ];
  const add = (text) => update((p) => ({ ...p, plans: { ...p.plans, [tab]: [{ id: uid(), text, done: false }, ...p.plans[tab]] } }));
  const toggle = (id) => update((p) => ({ ...p, plans: { ...p.plans, [tab]: p.plans[tab].map((x) => x.id === id ? { ...x, done: !x.done } : x) } }));
  const del = (id) => update((p) => ({ ...p, plans: { ...p.plans, [tab]: p.plans[tab].filter((x) => x.id !== id) } }));
  const list = db.plans[tab];
  const doneCount = list.filter((x) => x.done).length;

  return (
    <div>
      <SectionTitle t={t} title="الخطط والأهداف" subtitle="من اليوم إلى العام — كل خطوة تقرّبك من صورتك الأكبر لحياتك" icon={ClipboardList} />

      <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
        {tabs.map((tb) => (
          <button
            key={tb.id}
            onClick={() => setTab(tb.id)}
            className="px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-colors"
            style={{ background: tab === tb.id ? t.accent : t.surfaceAlt, color: tab === tb.id ? "#fff" : t.inkSoft, fontFamily: "Cairo" }}
          >
            {tb.label}
          </button>
        ))}
      </div>

      <Card t={t} className="p-5">
        <div className="flex items-center justify-between mb-3">
          <span className="text-xs" style={{ color: t.inkSoft }}>{doneCount}/{list.length} مكتملة</span>
          <AddInline t={t} onAdd={add} placeholder="هدف جديد..." />
        </div>
        {list.length === 0 ? (
          <EmptyState t={t} icon={Target} text="أضيفي أهدافك لهذه الفترة." />
        ) : (
          <div className="space-y-2">
            {list.map((it, idx) => (
              <div key={it.id} className="flex items-center gap-3 p-3 rounded-xl border list-item-in" style={{ borderColor: t.border, animationDelay: `${Math.min(idx, 10) * 35}ms` }}>
                <button onClick={() => toggle(it.id)} className="w-6 h-6 rounded-md flex items-center justify-center shrink-0" style={{ background: it.done ? t.mintSoft : t.surfaceAlt, color: it.done ? t.mint : t.inkFaint }}>
                  {it.done && <Check size={14} />}
                </button>
                <span className="flex-1 text-sm" style={{ color: it.done ? t.inkFaint : t.ink, textDecoration: it.done ? "line-through" : "none" }}>{it.text}</span>
                <IconBtn t={t} danger onClick={() => del(it.id)}><Trash2 size={14} /></IconBtn>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

          فستفقدين البيانات ما لم تكوني قد نزّلتِ نسخة احتياطية. يُنصح بتنزيل نسخة احتياطية أسبوعيًا على الأقل.
        </p>
      </Card>
    </div>
  );
}

/* ============================================================
   ورقة الإضافة السريعة (Quick Add Sheet)
   ============================================================ */
function QuickAddSheet({ t, open, onClose, update }) {
  const [kind, setKind] = useState("task");
  const [text, setText] = useState("");

  const kinds = [
    { id: "task", label: "مهمة", icon: CheckSquare, color: t.accent },
    { id: "idea", label: "فكرة", icon: Sparkles, color: t.night },
    { id: "journal", label: "خاطرة", icon: PenLine, color: t.gold },
    { id: "expense", label: "مصروف", icon: Wallet, color: t.amber },
  ];

  const submit = () => {
    if (!text.trim()) return;
    const v = text.trim();
    if (kind === "task") {
      update((p) => ({ ...p, dailyTasks: [{ id: uid(), title: v, status: "قيد الانتظار", priority: "متوسطة", date: todayISO() }, ...p.dailyTasks] }));
    } else if (kind === "idea") {
      update((p) => ({ ...p, ideas: [{ id: uid(), text: v }, ...p.ideas] }));
    } else if (kind === "journal") {
      update((p) => ({ ...p, journal: { entries: [{ id: uid(), date: todayISO(), mood: "", gratitude: "", note: v }, ...p.journal.entries] } }));
    } else if (kind === "expense") {
      update((p) => ({ ...p, home: { ...p.home, expenses: [{ id: uid(), date: todayISO(), title: v, amount: 0, category: "" }, ...p.home.expenses] } }));
    }
    setText("");
    onClose();
  };

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center sheet-backdrop" onClick={onClose}>
      <div
        className="w-full sm:max-w-md sheet-panel rounded-t-[28px] sm:rounded-[26px] p-5 pb-8 sm:pb-6 border"
        style={{ background: t.surfaceSolid, borderColor: t.border }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="w-10 h-1.5 rounded-full mx-auto mb-4 sm:hidden" style={{ background: t.border }} />
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-black text-lg" style={{ color: t.ink, fontFamily: "Cairo" }}>إضافة سريعة</h3>
          <IconBtn t={t} onClick={onClose}><X size={16} /></IconBtn>
        </div>
        <div className="grid grid-cols-4 gap-2 mb-4">
          {kinds.map((k) => (
            <button
              key={k.id}
              onClick={() => setKind(k.id)}
              className="flex flex-col items-center gap-1.5 py-3 rounded-2xl border press-scale"
              style={{ borderColor: kind === k.id ? k.color : t.border, background: kind === k.id ? k.color + "1F" : "rgba(255,255,255,0.02)" }}
            >
              <k.icon size={18} color={kind === k.id ? k.color : t.inkSoft} />
              <span className="text-[11px] font-bold" style={{ color: kind === k.id ? k.color : t.inkSoft }}>{k.label}</span>
            </button>
          ))}
        </div>
        <TextArea t={t} rows={3} value={text} onChange={(e) => setText(e.target.value)} placeholder="اكتبي هنا..." autoFocus />
        <button
          onClick={submit}
          className="w-full mt-4 py-3.5 rounded-[16px] font-black press-scale shadow-btn"
          style={{ background: `linear-gradient(135deg, ${t.accent}, ${t.accent2}, ${t.night})`, color: "#fff", fontFamily: "Cairo" }}
        >
          حفظ
        </button>
      </div>
    </div>
  );
}

    </div>
  );
}
